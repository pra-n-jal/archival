<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HYPERSTITION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="wall-canvas"></canvas>

  <div id="intro-prompt" class="intro-prompt">
    <div class="prompt-text">USE A / D OR ARROWS TO MOVE</div>
    <div class="prompt-sub">DRAG OR HORIZONTAL SCROLL ALSO ENABLED</div>
  </div>

  <header class="archival-header">
    <div class="archival-title">HYPERSTITION</div>
    <div class="archival-meta">
      <span id="pos-display">LOC: 0000.0 m</span>
      <span class="sep">|</span>
      <span id="chunk-display">SECTOR 00</span>
    </div>
  </header>

  <script type="module" src="src/main.js"></script>
</body>
</html>
